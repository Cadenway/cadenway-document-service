# Definition of document-service for Docker Compose; keep it self-contained.
# On each release the deploy workflow checks it and copies it into cadenway-ops, as
# environments/<env>/services/document-service.yaml for the environment it deploys to.
#
# Internal service: no Traefik label, no published port. Secret values are referenced by name;
# they live in cadenway-ops, which documents each variable in docs/service-environment.md. The
# user API requires both Task access settings. Select search-only for a projection-only profile.
#
# The folded INTERNAL_TOKEN_TRUSTED_ISSUERS scalar supplies the API gateway issuer as one line of
# JSON. The optional Search public keys enable verification for search-service.
#
# MIGRATION_DATABASE_URL is deliberately absent: the GitOps agent of cadenway-ops hands the
# migrator's URL to the one-off migration container only (docs/database.md there), so the running
# service never holds the owner credentials of its schema.
services:
  document-service:
    image: ghcr.io/${GHCR_OWNER}/cadenway-document-service:${DOCUMENT_SERVICE_VERSION}
    restart: unless-stopped
    environment:
      PORT: '3014'
      DATABASE_URL: ${DOCUMENT_SERVICE_DATABASE_URL}
      NATS_URL: ${NATS_URL}
      NATS_USER: document
      NATS_PASSWORD: ${DOCUMENT_NATS_PASSWORD}
      INTERNAL_TOKEN_AUDIENCE: document-service
      INTERNAL_TOKEN_TRUSTED_ISSUERS: >-
        {"api-gateway": [${API_GATEWAY_INTERNAL_TOKEN_PUBLIC_JWKS}]}
      SEARCH_SERVICE_INTERNAL_TOKEN_PUBLIC_JWKS: ${SEARCH_SERVICE_INTERNAL_TOKEN_PUBLIC_JWKS:-}
      SEARCH_PROJECTION_CURSOR_SECRET: ${DOCUMENT_SEARCH_PROJECTION_CURSOR_SECRET:-}
      DOCUMENT_ACCESS_MODE: ${DOCUMENT_ACCESS_MODE:-task-authorized}
      TASK_SERVICE_URL: ${DOCUMENT_TASK_SERVICE_URL:-}
      INTERNAL_TOKEN_PRIVATE_JWK: ${DOCUMENT_SERVICE_INTERNAL_TOKEN_PRIVATE_JWK:-}
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3014/health/ready']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M

# Declared identically by cadenway-ops and by every service definition it includes.
networks:
  internal: {}
